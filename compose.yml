name: gusim
services:
  frontend-prepare:
    image: node:22-bookworm-slim
    entrypoint: ["/bin/sh", "/scripts/prepare-frontend.sh"]
    volumes:
      - type: bind
        source: ${FRONTEND_SOURCE:-./frontend}
        target: /source
        read_only: true
        bind:
          create_host_path: false
      - ./deploy/prepare-frontend.sh:/scripts/prepare-frontend.sh:ro
      - frontend-work:/work
      - frontend-dist:/output
      - pnpm-cache:/pnpm-store
    restart: "no"
  backend-prepare:
    image: maven:3.9.9-eclipse-temurin-21
    entrypoint: ["/bin/sh", "/scripts/prepare-backend.sh"]
    volumes:
      - type: bind
        source: ${BACKEND_SOURCE:-./backend}
        target: /source
        read_only: true
        bind:
          create_host_path: false
      - ./deploy/prepare-backend.sh:/scripts/prepare-backend.sh:ro
      - backend-work:/work
      - maven-cache:/root/.m2
      - uploads:/data/uploads
    restart: "no"
  backend:
    image: eclipse-temurin:21-jre
    ports:
      - "8080:8080"
    user: "10001:10001"
    working_dir: /work
    command: ["java", "-jar", "/work/app.jar"]
    env_file:
      - ./config/database.env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-db}
      SPRING_JPA_HIBERNATE_DDL_AUTO: "none"
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      UPLOAD_DIR: /data/uploads
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-동아리 관리자}
      BOOTSTRAP_ADMIN_STUDENT_NUMBER: ${BOOTSTRAP_ADMIN_STUDENT_NUMBER:-20001000}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-12345678}
    volumes:
      - backend-work:/work:ro
      - uploads:/data/uploads
    depends_on:
      backend-prepare:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    restart: unless-stopped
  frontend:
    image: nginx:1.28-alpine
    ports:
      - "80:80"
    volumes:
      - frontend-dist:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend-prepare:
        condition: service_completed_successfully
      backend:
        condition: service_started
    restart: unless-stopped
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?Set DB_DATABASE in config/database.env}
      MYSQL_USER: ${DB_USERNAME:?Set DB_USERNAME in config/database.env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in config/database.env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in config/database.env}
    volumes:
      - mysql:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost --silent"]
      interval: 10s
      retries: 20
    restart: unless-stopped
networks:
  default:
    name: gusim-web
volumes:
  frontend-work:
  frontend-dist:
  backend-work:
  pnpm-cache:
  maven-cache:
  uploads:
  mysql:
